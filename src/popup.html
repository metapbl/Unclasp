<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 시안 A 출처 색 (D047). 색은 진단 테두리 다섯 색과 그 바탕만 쓴다 */
  :root {
    --bg: #ffffff; --ink: #1d2126; --muted: #69717c; --line: #dde1e6; --soft: #eef0f3;
    --accent: #2d7ff9; --on-accent: #fff; --danger: #c0392b; --knob: #fff; --track: #c4c9d0;
    --c-custom: #2d7ff9; --c-base: #e74c3c; --c-ex: #27ae60; --c-text: #e67e22; --c-will: #7f8c8d;
    --ok-bg: #e8f1fe; --bad-bg: #fdecea;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d2024; --ink: #e7e9ec; --muted: #9aa1ab; --line: #2e3238; --soft: #252930;
      --accent: #5c9dff; --on-accent: #0d1420; --danger: #ef7a70; --knob: #e7e9ec; --track: #464b53;
      --ok-bg: #1c2b44; --bad-bg: #3a2220;
    }
  }
  * { box-sizing: border-box; }
  body { width: 330px; margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
         font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #host { font-size: 14px; font-weight: 650; word-break: break-all; }
  #count { font-size: 11px; color: var(--muted); margin: 2px 0 12px; }

  .head, .row { display: grid; grid-template-columns: 1fr 52px 52px; align-items: center; }
  .head { font-size: 11px; color: var(--muted); }
  .head .c { text-align: center; }
  .row { min-height: 30px; }
  .row .n { display: flex; align-items: center; gap: 4px; }
  .row .c { display: flex; justify-content: center; }
  /* 이 사이트 덮어쓰기 표시. 누르면 기본값 따름으로 돌아간다 */
  .ov { border: none; background: none; padding: 0 2px; color: var(--accent); font-size: 10px; line-height: 1; cursor: pointer; }
  .ov:empty { display: none; }

  .sw { position: relative; display: inline-block; width: 36px; height: 20px; }
  .sw input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .sw input:disabled { cursor: default; }
  .track { position: absolute; inset: 0; border-radius: 10px; background: var(--track); pointer-events: none; transition: background .15s; }
  .track::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; border-radius: 50%;
                   background: var(--knob); transition: transform .15s; }
  input:checked + .track { background: var(--accent); }
  input:checked + .track::before { transform: translateX(16px); background: var(--on-accent); }
  input:disabled + .track { opacity: .35; }
  input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw.inherit .track { opacity: .55; }

  hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .tool { display: grid; grid-template-columns: 1fr 52px; align-items: center; min-height: 32px; }
  .tool .c { display: flex; justify-content: center; }
  .note { display: block; font-size: 11px; color: var(--muted); }

  /* 진단 범례: 출처 비율 띠와 출처별 건수. 페이지의 테두리 색·모양과 같다 */
  #legend { display: none; margin: 8px 0 0; }
  #ratio { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; background: var(--soft); }
  #ratio span { flex: 0; }
  .lgs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .lg { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); }
  .lg::before { content: ""; width: 18px; border-top: 2px dashed; margin-bottom: 3px; }
  .lg .v { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .lg.z { opacity: .4; }
  .custom { color: var(--c-custom); } .base { color: var(--c-base); } .ex { color: var(--c-ex); }
  .text { color: var(--c-text); } .will { color: var(--c-will); }
  .lg.ex::before { border-top-style: solid; } .lg.will::before { border-top-style: dotted; }
  #ratio .custom { background: var(--c-custom); } #ratio .base { background: var(--c-base); } #ratio .ex { background: var(--c-ex); }
  #ratio .text { background: var(--c-text); } #ratio .will { background: var(--c-will); }

  #selhead { font-size: 11px; color: var(--muted); margin: 12px 0 4px; display: none; }
  #sels .s { display: flex; align-items: center; gap: 8px; padding: 4px 0 4px 8px; margin-bottom: 4px;
             border-left: 2px dashed var(--c-custom); }
  #sels .t { flex: 1; min-width: 0; font: 11px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge.ok  { background: var(--ok-bg); color: var(--accent); }
  .badge.off { background: var(--soft); color: var(--muted); }
  .badge.bad { background: var(--bad-bg); color: var(--danger); }
  #sels .x { border: none; background: none; color: var(--muted); font-size: 12px; line-height: 1; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  #sels .x:hover { color: var(--danger); background: var(--soft); }

  .bar { display: flex; gap: 6px; margin-top: 12px; }
  button.btn { font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); background: var(--bg);
               color: var(--ink); border-radius: 6px; cursor: pointer; }
  button.btn:hover:not(:disabled) { background: var(--soft); }
  button.btn:disabled { opacity: .45; cursor: default; }
  #opts { margin-left: auto; }
  #msg { font-size: 11px; color: var(--danger); min-height: 14px; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div id="host">-</div>
  <div id="count">-</div>
  <div class="head"><span></span><span class="c">전체</span><span class="c">이 사이트</span></div>
  <div id="rows"></div>
  <hr>
  <div class="tool">
    <span>진단 모드<span class="note">숨기는 대신 테두리로 표시</span></span>
    <span class="c"><label class="sw">
      <input type="checkbox" id="diag" aria-label="진단 모드"><span class="track"></span></label></span>
  </div>
  <div class="tool">
    <span>골라 숨기기<span class="note">페이지에서 숨길 곳을 눌러 등록</span></span>
    <span class="c"><label class="sw">
      <input type="checkbox" id="pick" aria-label="골라 숨기기"><span class="track"></span></label></span>
  </div>
  <div id="legend">
    <div id="ratio" aria-hidden="true"><span class="custom"></span><span class="base"></span><span class="ex"></span><span class="text"></span><span class="will"></span></div>
    <div class="lgs">
      <div class="lg custom" id="lg-custom"><span class="v">-</span><span class="t">내 규칙</span></div>
      <div class="lg base" id="lg-base"><span class="v">-</span><span class="t">기본</span></div>
      <div class="lg ex" id="lg-ex"><span class="v">-</span><span class="t">예외</span></div>
      <div class="lg text" id="lg-text"><span class="v">-</span><span class="t">텍스트</span></div>
      <div class="lg will" id="lg-will"><span class="v">-</span><span class="t">접힘</span></div>
    </div>
  </div>
  <div id="selhead">내가 숨긴 항목</div>
  <div id="sels"></div>
  <div class="bar">
    <button class="btn" id="reset">사이트 초기화</button>
    <button class="btn" id="opts">전체 설정</button>
  </div>
  <div id="msg"></div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
